project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - aulas/*.qmd

website:
  title: "Ciência de Dados"
  site-url: https://oandrefonseca.github.io/data-science/
  search: true
  repo-url: https://github.com/oandrefonseca/data-science
  repo-branch: main
  repo-actions: [source, issue]
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - index.qmd
      - section: "Roteiros de aula"
        contents:
          - text: "1. Ferramentas, Ambiente e Versionamento"
            href: aulas/01-ferramentas-ambiente-versionamento.qmd
          - text: "2. Introdução aos Dados Tabulares"
            href: aulas/02-introducao-dados-tabulares.qmd
          - text: "3. Análise de Vendas"
            href: aulas/03-analise-vendas.qmd
          - text: "4. Análise de Vendas em R"
            href: aulas/04-analise-vendas-r.qmd

language:
  title-block-author-single: "Autor"

execute:
  enabled: false
  freeze: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-copy: true
    code-overflow: scroll
    code-line-numbers: false
    fig-align: center
    link-external-newwindow: true

lang: pt-BR
